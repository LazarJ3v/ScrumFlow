<!-- register.component.html -->

<div class="register-wrapper">
  <div class="register-card">

    <!-- LOGO -->
    <div routerLink="" class="register-logo">
      <span class="logo-dot"></span>
      ScrumFlow
    </div>

    <h2 class="register-title">Kreiraj nalog</h2>
    <p class="register-sub">Pridruži se svom timu na ScrumFlow-u</p>

    <!-- ERROR -->
    @if (error()) {
      <div class="error-msg">{{ error() }}</div>
    }

    <form (ngSubmit)="onSubmit()" #registerForm="ngForm">

      <!-- IME I PREZIME -->
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Ime</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              type="text"
              class="form-input"
              placeholder="Marko"
              [ngModel]="firstName()"
              (ngModelChange)="firstName.set($event)"
              name="firstName"
              required />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Prezime</label>
          <div class="input-wrap">
            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
              <circle cx="12" cy="7" r="4"/>
            </svg>
            <input
              type="text"
              class="form-input"
              placeholder="Nikolic"
              [ngModel]="lastName()"
              (ngModelChange)="lastName.set($event)"
              name="lastName"
              required />
          </div>
        </div>
      </div>

      <!-- EMAIL -->
      <div class="form-group">
        <label class="form-label">Email adresa</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input
            type="email"
            class="form-input"
            placeholder="ime@kompanija.com"
            [ngModel]="email()"
            (ngModelChange)="email.set($event)"
            name="email"
            required />
        </div>
      </div>

      <!-- ULOGA -->
      <div class="form-group">
        <label class="form-label">Uloga u timu</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
            <circle cx="9" cy="7" r="4"/>
            <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
            <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
          </svg>
          <select
            class="form-input form-select"
            [ngModel]="role()"
            (ngModelChange)="role.set($event)"
            name="role">
            @for (r of roles; track r.value) {
              <option [value]="r.value">{{ r.label }}</option>
            }
          </select>
        </div>
      </div>

      <!-- PASSWORD -->
      <div class="form-group">
        <label class="form-label">Lozinka</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            [type]="showPassword() ? 'text' : 'password'"
            class="form-input"
            placeholder="••••••••"
            [ngModel]="password()"
            (ngModelChange)="password.set($event)"
            name="password"
            required />
          <button type="button" class="toggle-password" (click)="togglePassword()">
            @if (showPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- CONFIRM PASSWORD -->
      <div class="form-group">
        <label class="form-label">Potvrdi lozinku</label>
        <div class="input-wrap">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input
            [type]="showConfirmPassword() ? 'text' : 'password'"
            class="form-input"
            placeholder="••••••••"
            [ngModel]="confirmPassword()"
            (ngModelChange)="confirmPassword.set($event)"
            name="confirmPassword"
            required />
          <button type="button" class="toggle-password" (click)="toggleConfirmPassword()">
            @if (showConfirmPassword()) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- SUBMIT -->
      <button type="submit" class="btn-register" [disabled]="isLoading()">
        {{ isLoading() ? 'Kreiranje naloga...' : 'Kreiraj nalog' }}
      </button>

    </form>

    <!-- DIVIDER -->
    <div class="divider-wrap">
      <div class="divider-line"></div>
      <span class="divider-text">ili</span>
      <div class="divider-line"></div>
    </div>

    <!-- LOGIN LINK -->
    <p class="login-text">
      Vec imas nalog?
      <a routerLink="/login" class="login-link">Prijavi se</a>
    </p>

  </div>
</div>
