<div class="join-code">
  <div class="widget-header">
    <h3 class="widget-title">Join kod tima</h3>
  </div>

  <p class="join-code__desc">
    Podeli ovaj kod sa novim članovima tima da se pridruže.
  </p>

  <div class="join-code__box">
    <span class="join-code__value">{{ code() }}</span>
    <button class="join-code__copy" (click)="copyCode()">
      @if (copied()) {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
        Kopirano
      } @else {
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
        </svg>
        Kopiraj
      }
    </button>
  </div>
</div>
